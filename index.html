<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0_4Z__8t4xCU-N6-40ozT1LdIPd7sZbdGYmKxl4IlhG-uZ96MTpJjP3ENSYqEMnjD/exec";

  // Set today's date by default
  document.getElementById('examDate').value = new Date().toISOString().split('T')[0];

  // Helper functions
  function syncLookupField(val) {
    document.getElementById('lookupUID').value = val.trim();
  }

  function getCheckedValues(name) {
    const nodes = document.querySelectorAll(`input[name="${name}"]:checked`);
    return Array.from(nodes).map(n => n.value).join('; ') || 'None';
  }

  function setCheckedValues(name, joinedStr) {
    document.querySelectorAll(`input[name="${name}"]`).forEach(cb => cb.checked = false);
    if (!joinedStr || joinedStr === 'None') return;
    const items = joinedStr.split(';').map(s => s.trim());
    document.querySelectorAll(`input[name="${name}"]`).forEach(cb => {
      cb.checked = items.includes(cb.value);
    });
  }

  // Network Watcher
  function updateNetworkIndicator() {
    const el = document.getElementById('netStatus');
    if (navigator.onLine) {
      el.textContent = '● Online';
      el.className = 'online';
    } else {
      el.textContent = '● Offline';
      el.className = 'offline';
    }
  }
  window.addEventListener('online', updateNetworkIndicator);
  window.addEventListener('offline', updateNetworkIndicator);
  updateNetworkIndicator();

  // 1. Form Mode Toggle (Adult / Child)
  function setFormMode(mode) {
    document.getElementById('form_type').value = mode;
    const isAdult = (mode === 'Adult');

    document.getElementById('tabAdult').className = 'toggle-btn' + (isAdult ? ' active' : '');
    document.getElementById('tabChild').className = 'toggle-btn' + (!isAdult ? ' active' : '');

    document.getElementById('adultHistoryGroup').style.display = isAdult ? 'contents' : 'none';
    document.getElementById('childHistoryGroup').style.display = !isAdult ? 'contents' : 'none';
    document.getElementById('nearVisionContainer').style.display = isAdult ? 'block' : 'none';
    document.getElementById('schoolClassGroup').style.display = !isAdult ? 'block' : 'none';
  }

  function handleAgeAutoSwitch(ageVal) {
    const age = parseInt(ageVal, 10);
    if (!isNaN(age)) {
      if (age < 16 && document.getElementById('form_type').value === 'Adult') {
        setFormMode('Child');
      } else if (age >= 16 && document.getElementById('form_type').value === 'Child') {
        setFormMode('Adult');
      }
    }
  }

  // 2. Real-Time Patient Fetch from Google Sheet
  async function fetchPatientByUID() {
    const uid = document.getElementById('lookupUID').value.trim();
    if (!uid) {
      alert("Please enter a Unique ID to search.");
      return;
    }

    const feedback = document.getElementById('syncFeedback');
    feedback.textContent = "⏳ Fetching patient from cloud...";

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "fetch_patient", uid: uid }),
        redirect: 'follow'
      });

      const res = await resp.json();

      if (res.status === "found") {
        const p = res.patient;
        setFormMode(p.form_type || 'Adult');

        // Populate Station 1
        document.getElementById('site').value = p.site || '';
        document.getElementById('uid').value = p.uid || uid;
        document.getElementById('name').value = p.name || '';
        document.getElementById('age').value = p.age || '';
        document.getElementById('gender').value = p.gender || '';
        if (p.examDate) {
          // Normalizes ISO format or standard date strings
          const d = new Date(p.examDate);
          document.getElementById('examDate').value = !isNaN(d) ? d.toISOString().split('T')[0] : p.examDate.substring(0, 10);
        }
        document.getElementById('phone').value = p.phone !== 'N/A' ? (p.phone || '') : '';
        document.getElementById('school_class').value = p.school_class !== 'N/A' ? (p.school_class || '') : '';

        // Populate Station 2
        setCheckedValues('blurred', p.blurred_vision);
        document.getElementById('h_pain').checked = (p.eye_pain === 'Yes');
        document.getElementById('h_spectacles').checked = (p.wears_spectacles === 'Yes');
        document.getElementById('h_meds').checked = (p.uses_meds === 'Yes');
        document.getElementById('h_surgery').checked = (p.surgery_history === 'Yes');
        document.getElementById('h_diabetes').checked = (p.diabetes === 'Yes');
        document.getElementById('h_hypertension').checked = (p.hypertension === 'Yes');
        document.getElementById('h_squint').checked = (p.squint_lazy_eye === 'Yes');
        document.getElementById('h_headache').checked = (p.headaches_reading === 'Yes');
        if (p.history_outcome) {
          const r = document.querySelector(`input[name="history_res"][value="${p.history_outcome}"]`);
          if (r) r.checked = true;
        }

        // Populate Station 3
        document.getElementById('dist_cond').value = p.dist_condition || 'Without spectacles';
        document.getElementById('dist_re').value = (p.dist_re !== 'N/A' ? p.dist_re : '') || '';
        document.getElementById('dist_le').value = (p.dist_le !== 'N/A' ? p.dist_le : '') || '';
        if (p.dist_outcome) {
          const r = document.querySelector(`input[name="dist_res"][value="${p.dist_outcome}"]`);
          if (r) r.checked = true;
        }
        document.getElementById('near_cond').value = p.near_condition || 'Without spectacles';
        document.getElementById('near_re').value = (p.near_re !== 'N/A' ? p.near_re : '') || '';
        document.getElementById('near_le').value = (p.near_le !== 'N/A' ? p.near_le : '') || '';
        if (p.near_outcome) {
          const r = document.querySelector(`input[name="near_res"][value="${p.near_outcome}"]`);
          if (r) r.checked = true;
        }

        // Populate Station 4
        setCheckedValues('ext_align', p.ext_alignment);
        setCheckedValues('ext_globe', p.ext_globe);
        setCheckedValues('ext_lids', p.ext_eyelids_lashes);
        setCheckedValues('ext_white', p.ext_white_conjunctiva);
        setCheckedValues('ext_black', p.ext_black_cornea);
        if (p.ext_outcome) {
          const r = document.querySelector(`input[name="ext_res"][value="${p.ext_outcome}"]`);
          if (r) r.checked = true;
        }
        document.getElementById('referred_zmec').value = p.referred_zmec || 'No';
        document.getElementById('optom_name').value = p.optometrist !== 'N/A' ? (p.optometrist || '') : '';

        feedback.textContent = `✅ Loaded: ${p.name || uid}`;
      } else {
        alert(`Patient "${uid}" not found. Verify the ID or register them at Station 1.`);
        feedback.textContent = "UID Not Found";
      }
    } catch (err) {
      console.error(err);
      alert("Failed to connect to Google Sheet. Please check device connectivity.");
      feedback.textContent = "Fetch Failed";
    }
  }

  // 3. Save Specific Station Data to Google Sheet
  async function saveSection(sectionNumber) {
    const uidInput = document.getElementById('uid');
    const uid = uidInput.value.trim();

    if (!uid) {
      alert("Please enter a Unique ID in Station 1 before saving.");
      uidInput.focus();
      return;
    }

    // Client-side validation for Station 1 registration
    if (sectionNumber === 1) {
      const site = document.getElementById('site').value.trim();
      const name = document.getElementById('name').value.trim();
      const age = document.getElementById('age').value.trim();
      if (!site || !name || !age) {
        alert("Please complete Site, Name, and Age before saving Station 1.");
        return;
      }
    }

    const mode = document.getElementById('form_type').value;
    const btn = document.querySelector(`#sec${sectionNumber} .section-save-btn`);
    const originalText = btn.textContent;
    btn.textContent = "⏳ Syncing...";
    btn.disabled = true;

    let payloadRecord = {
      form_type: mode,
      uid: uid
    };

    if (sectionNumber === 1) {
      payloadRecord.site = document.getElementById('site').value.trim();
      payloadRecord.name = document.getElementById('name').value.trim();
      payloadRecord.age = document.getElementById('age').value.trim();
      payloadRecord.gender = document.getElementById('gender').value;
      payloadRecord.examDate = document.getElementById('examDate').value;
      payloadRecord.phone = document.getElementById('phone').value.trim() || 'N/A';
      payloadRecord.school_class = document.getElementById('school_class').value.trim() || 'N/A';
    } else if (sectionNumber === 2) {
      payloadRecord.blurred_vision = getCheckedValues('blurred');
      payloadRecord.eye_pain = document.getElementById('h_pain').checked ? 'Yes' : 'No';
      payloadRecord.wears_spectacles = document.getElementById('h_spectacles').checked ? 'Yes' : 'No';
      payloadRecord.uses_meds = document.getElementById('h_meds').checked ? 'Yes' : 'No';
      payloadRecord.surgery_history = document.getElementById('h_surgery').checked ? 'Yes' : 'No';
      payloadRecord.diabetes = mode === 'Adult' ? (document.getElementById('h_diabetes').checked ? 'Yes' : 'No') : 'N/A';
      payloadRecord.hypertension = mode === 'Adult' ? (document.getElementById('h_hypertension').checked ? 'Yes' : 'No') : 'N/A';
      payloadRecord.squint_lazy_eye = mode === 'Child' ? (document.getElementById('h_squint').checked ? 'Yes' : 'No') : 'N/A';
      payloadRecord.headaches_reading = mode === 'Child' ? (document.getElementById('h_headache').checked ? 'Yes' : 'No') : 'N/A';
      payloadRecord.history_outcome = document.querySelector('input[name="history_res"]:checked').value;
    } else if (sectionNumber === 3) {
      payloadRecord.dist_condition = document.getElementById('dist_cond').value;
      payloadRecord.dist_re = document.getElementById('dist_re').value.trim() || 'N/A';
      payloadRecord.dist_le = document.getElementById('dist_le').value.trim() || 'N/A';
      payloadRecord.dist_outcome = document.querySelector('input[name="dist_res"]:checked').value;
      payloadRecord.near_condition = mode === 'Adult' ? document.getElementById('near_cond').value : 'N/A';
      payloadRecord.near_re = mode === 'Adult' ? (document.getElementById('near_re').value.trim() || 'N/A') : 'N/A';
      payloadRecord.near_le = mode === 'Adult' ? (document.getElementById('near_le').value.trim() || 'N/A') : 'N/A';
      payloadRecord.near_outcome = mode === 'Adult' ? document.querySelector('input[name="near_res"]:checked').value : 'N/A';
    } else if (sectionNumber === 4) {
      payloadRecord.ext_alignment = getCheckedValues('ext_align');
      payloadRecord.ext_globe = getCheckedValues('ext_globe');
      payloadRecord.ext_eyelids_lashes = getCheckedValues('ext_lids');
      payloadRecord.ext_white_conjunctiva = getCheckedValues('ext_white');
      payloadRecord.ext_black_cornea = getCheckedValues('ext_black');
      payloadRecord.ext_outcome = document.querySelector('input[name="ext_res"]:checked').value;
      payloadRecord.referred_zmec = document.getElementById('referred_zmec').value;
      payloadRecord.optometrist = document.getElementById('optom_name').value.trim() || 'N/A';
    }

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "save_section", record: payloadRecord }),
        redirect: 'follow'
      });

      const res = await resp.json();
      if (res.status === 'success') {
        btn.textContent = `✅ Station ${sectionNumber} Saved & Synced!`;
        btn.className = "section-save-btn saved";
        document.getElementById('syncFeedback').textContent = `● Synced UID: ${uid} (Station ${sectionNumber})`;
        
        // Ensure top lookup field matches current UID
        syncLookupField(uid);

        setTimeout(() => {
          btn.textContent = originalText;
          btn.className = "section-save-btn";
          btn.disabled = false;
        }, 2200);
      } else {
        alert("Google Sheet returned an error: " + res.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      alert("Network Error: Could not reach Google Sheets. Please verify the device's internet connection.");
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  // 4. Reset Form for New Patient
  function startNewPatient() {
    const siteVal = document.getElementById('site').value;
    const optomVal = document.getElementById('optom_name').value;
    
    // Clear textual inputs
    document.querySelectorAll('input[type="text"], input[type="number"], input[type="tel"]').forEach(i => i.value = '');
    
    // Uncheck general checkboxes
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    
    // Reset standard clinical baseline defaults
    document.querySelectorAll('input[value="Normal"], input[value="Straight Eyes"]').forEach(c => c.checked = true);
    document.querySelectorAll('input[value="Pass"]').forEach(r => r.checked = true);
    document.getElementById('dist_cond').value = 'Without spectacles';
    document.getElementById('near_cond').value = 'Without spectacles';
    document.getElementById('referred_zmec').value = 'No';

    // Retain site and staff credentials for rapid workflow
    document.getElementById('site').value = siteVal;
    document.getElementById('optom_name').value = optomVal;
    document.getElementById('examDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('lookupUID').value = '';
    document.getElementById('syncFeedback').textContent = 'Ready for new patient';
    // 5. Register Service Worker for PWA and Offline Support
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then((reg) => {
          console.log('SW Registered successfully with scope:', reg.scope);
          reg.update();
        })
        .catch((err) => console.error('SW Registration Failed:', err));
    });
  }
  }
</script>
